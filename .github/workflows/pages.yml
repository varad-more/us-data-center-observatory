name: Deploy to GitHub Pages

# The site is built purely from the static snapshot committed under
# apps/web/public/api, so this workflow needs no Python, no database, and no
# network access to any public source. Regenerating that snapshot is a separate,
# deliberate act (`make export-api`), verified by the CI workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Build static site
        working-directory: apps/web
        run: npm run build

      - name: Verify the build pre-rendered site routes
        working-directory: apps/web
        run: |
          # Directory form, because trailingSlash emits <route>/index.html. That
          # is what lets Pages answer /sources/ as well as /sources; the flat
          # <route>.html layout these paths used to name answered only the bare
          # form and 404'd every trailing-slash URL, including the one the README
          # publishes. This step is what caught the change, so keep it pinned to
          # the layout actually being served.
          test -f out/index.html
          test -f out/sites/index.html
          test -f out/sites/AZ-MESA-001/index.html
          test -f out/large-load-filings/index.html
          test -f out/regions/county-51107/index.html
          test -f out/api/large-load-filings.json
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/CNAME
          test -f out/.nojekyll
          # No route may regress to the flat layout while the rest use directories.
          ! find out -mindepth 2 -name '*.html' ! -name 'index.html' | grep .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

      - id: deployment
        uses: actions/deploy-pages@v5
