name: Deploy to GitHub Pages

# The site is built purely from the static snapshot committed under
# apps/web/public/api, so this workflow needs no Python, no database, and no
# network access to any public source. Regenerating that snapshot is a separate,
# deliberate act (`make export-api`), verified by the CI workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Build static site
        working-directory: apps/web
        run: npm run build

      - name: Verify the build pre-rendered site routes
        working-directory: apps/web
        run: |
          test -f out/index.html
          test -f out/sites.html
          test -f out/sites/AZ-MESA-001.html
          test -f out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

      - id: deployment
        uses: actions/deploy-pages@v5
