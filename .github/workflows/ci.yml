name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs entirely offline. Connectors replay recorded fixtures rather
  # than reach a county server, so CI can never be broken by a public source
  # being slow, rate-limited, or down.
  HELIOS_ALLOW_LIVE_FETCH: "false"

jobs:
  # ───────────────────────────── Backend (no database) ───────────────────────
  backend-static:
    name: "Backend — ${{ matrix.check }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ lint, typecheck, test ]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,documents]"

    - name: Lint (ruff + black)
      if: matrix.check == 'lint'
      run: |
        ruff check packages apps/api apps/worker tests scripts
        black --check packages apps/api apps/worker tests scripts

    - name: Type check (mypy)
      if: matrix.check == 'typecheck'
      run: mypy packages apps/api apps/worker

    # These must pass with no database and no optional services, because that
    # is what a contributor has on a fresh clone.
    - name: Unit & contract tests
      if: matrix.check == 'test'
      run: pytest -m "unit or contract" --tb=short -q

  # ──────────────────────── Backend (PostGIS integration) ────────────────────
  backend-integration:
    name: "Backend — integration"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      HELIOS_DATABASE_URL: postgresql+psycopg://helios:helios@localhost:5432/helios
      HELIOS_TEST_DATABASE_URL: postgresql+psycopg://helios:helios@localhost:5432/helios_test
      HELIOS_EVIDENCE_BACKEND: filesystem
      HELIOS_EVIDENCE_ROOT: ${{ github.workspace }}/.evidence-store

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,documents]"

    - name: Create test database
      run: |
        PGPASSWORD=helios psql -h localhost -U helios -d helios \
          -c "CREATE DATABASE helios_test;"

    - name: Integration & end-to-end tests
      run: pytest -m "integration or e2e" --tb=short -q

  # ───────────────── The published snapshot is genuinely reproducible ────────
  # Helios publishes a static snapshot of its own API. This job proves that
  # snapshot can still be regenerated by the real pipeline from recorded
  # fixtures - that the committed JSON is real output, not something
  # hand-written. It deliberately re-runs bootstrap end to end.
  export-reproducible:
    name: "Static export — reproducible from fixtures"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      HELIOS_DATABASE_URL: postgresql+psycopg://helios:helios@localhost:5432/helios
      HELIOS_EVIDENCE_BACKEND: filesystem
      HELIOS_EVIDENCE_ROOT: ${{ github.workspace }}/.evidence-store

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,documents]"

    - name: Migrate
      run: alembic upgrade head

    - name: Seed from recorded fixtures
      run: helios bootstrap

    - name: Export the API to static JSON
      run: python scripts/export_static_api.py

    - name: The snapshot must contain the flagship case with real evidence
      run: python scripts/verify_static_export.py

    - name: Report drift from the committed snapshot
      run: |
        if git diff --quiet -- apps/web/public/api; then
          echo "Committed snapshot matches a fresh export."
        else
          echo "::warning::The committed snapshot differs from a fresh export."
          echo "Run 'make export-api' and commit the result to refresh it."
          git diff --stat -- apps/web/public/api
        fi

    # This job is the only place in the project that reliably has PostGIS, so the
    # export it just built is worth keeping rather than discarding. Refreshing the
    # committed snapshot otherwise requires a local database, which shuts out
    # anyone working on the frontend alone.
    - name: Publish the freshly built snapshot
      uses: actions/upload-artifact@v7
      with:
        name: static-api-snapshot
        path: apps/web/public/api
        retention-days: 7
        # The exporter writes a .nojekyll into the snapshot, and upload-artifact
        # drops dotfiles unless told otherwise. Without this the downloaded
        # snapshot is subtly incomplete and committing it deletes a file that the
        # next export puts straight back — permanent phantom drift.
        include-hidden-files: true

  # ─────────────────────────────── Frontend (Node) ───────────────────────────
  frontend:
    name: "Frontend — ${{ matrix.check }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ lint, typecheck, test, build ]
    defaults:
      run:
        working-directory: apps/web

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - run: npm ci

    - name: Lint (eslint)
      if: matrix.check == 'lint'
      run: npm run lint

    # globals.css states a contrast obligation against nearly every token. This
    # checks the values actually meet it, because the failure mode is invisible:
    # a border that fails 3:1 still looks like a border to whoever chose it.
    # Pure stdlib, so it needs no Python setup.
    - name: Contrast audit (WCAG floors)
      if: matrix.check == 'lint'
      working-directory: .
      run: python3 scripts/audit_contrast.py

    - name: Type check (tsc)
      if: matrix.check == 'typecheck'
      run: npm run typecheck

    - name: Tests (vitest)
      if: matrix.check == 'test'
      run: npm test

    # Proves the committed snapshot is enough to build the whole site with no
    # backend present - the case for anyone who only touches the frontend.
    - name: Static export builds and pre-renders site routes
      if: matrix.check == 'build'
      run: |
        npm run build
        test -f out/sites.html
        test -f out/sites/AZ-MESA-001.html
        test -f out/.nojekyll

  # ─────────────────────────────── Infrastructure ────────────────────────────
  terraform:
    name: "Terraform — validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
    - uses: actions/checkout@v7
    - uses: hashicorp/setup-terraform@v4
    - run: terraform init -backend=false
    - run: terraform validate
