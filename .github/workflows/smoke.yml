name: Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,documents]"

    - name: Start services (db-up)
      run: make db-up

    - name: Wait for PostgreSQL
      run: |
        until docker compose exec -T postgres pg_isready -U helios; do
          sleep 1
        done

    - name: Run migrations
      run: make migrate

    - name: Bootstrap and Backtest
      run: |
        helios bootstrap
        helios backtest tests/fixtures/backtest/east_valley_cases.json

  terraform:
    name: "Terraform Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    steps:
    - uses: actions/checkout@v4
    
    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      
    - name: Terraform Validate
      run: terraform validate
